<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tennessee Physiographic Regions Quiz</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #e94560;
    --accent2: #0f3460;
    --text: #eee;
    --muted: #aaa;
    --correct: #2ecc71;
    --wrong: #e74c3c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
    background: linear-gradient(135deg, var(--accent), #f39c12);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .quiz-container {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    max-width: 1240px;
    width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .prompt { font-size: 1.15rem; font-weight: 600; }
  .prompt span {
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .stats { display: flex; gap: 16px; font-size: 0.9rem; color: var(--muted); }
  .stats .val { color: var(--text); font-weight: 700; }
  .map-wrapper {
    position: relative;
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid var(--accent2);
    background: #cfe0d8;
  }
  svg#map-svg { width: 100%; height: auto; display: block; }
  .region {
    stroke: #2a2a3a;
    stroke-width: 1.2;
    cursor: pointer;
    transition: filter 0.15s, opacity 0.15s;
  }
  .region:hover { filter: brightness(1.1); }
  .region.answered { cursor: default; }
  .region.answered:hover { filter: none; }
  .region.hint-target {
    animation: pulseHint 1.2s ease-in-out infinite;
  }
  @keyframes pulseHint {
    0%, 100% { filter: brightness(1) saturate(1); }
    50% { filter: brightness(1.35) saturate(1.4); }
  }
  .region.flash-correct { animation: flashCorrect 0.6s ease; }
  .region.flash-wrong { animation: flashWrong 0.6s ease; }
  @keyframes flashCorrect {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.6) saturate(1.6); }
  }
  @keyframes flashWrong {
    0%, 100% { filter: brightness(1); }
    25%, 75% { filter: brightness(0.6) saturate(2); }
  }
  .region-label {
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-weight: 700;
    fill: #1a1a2e;
    paint-order: stroke;
    stroke: rgba(255,255,255,0.85);
    stroke-width: 3px;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .region-label.visible { opacity: 1; }
  .region-label.brief { fill: #c0392b; }
  .feedback {
    margin-top: 12px;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    min-height: 40px;
    display: flex;
    align-items: center;
    transition: all 0.3s;
  }
  .feedback.correct { background: rgba(46,204,113,0.15); color: var(--correct); border: 1px solid var(--correct); }
  .feedback.wrong { background: rgba(231,76,60,0.15); color: var(--wrong); border: 1px solid var(--wrong); }
  .feedback.info { background: rgba(15,52,96,0.3); color: var(--muted); border: 1px solid var(--accent2); }
  .progress-wrap {
    margin-top: 12px;
    background: var(--accent2);
    border-radius: 6px;
    height: 8px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #f39c12);
    border-radius: 6px;
    transition: width 0.4s ease;
  }
  .controls {
    margin-top: 12px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .hint-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: var(--muted);
    cursor: pointer;
    padding: 8px 14px;
    border-radius: 8px;
    background: var(--accent2);
    user-select: none;
  }
  .hint-toggle input { cursor: pointer; }
  .hint-toggle.active { color: var(--text); }
  button {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #d63050; transform: translateY(-1px); }
  .btn-secondary { background: var(--accent2); color: var(--text); }
  .btn-secondary:hover { background: #1a4a7a; }
  .region-list { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  .region-chip {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    background: var(--accent2);
    color: var(--muted);
    transition: all 0.3s;
  }
  .region-chip.done { background: rgba(46,204,113,0.2); color: var(--correct); text-decoration: line-through; }
  .region-chip.current { background: var(--accent); color: white; }
  .score-screen { text-align: center; padding: 40px 20px; }
  .score-screen h2 { font-size: 2rem; margin-bottom: 8px; }
  .score-screen .big-score { font-size: 4rem; font-weight: 800; color: var(--accent); }
  .score-screen p { color: var(--muted); margin-bottom: 20px; }
  .hidden { display: none; }
  .support-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(233,69,96,0.12);
    border: 1px solid rgba(233,69,96,0.4);
    color: var(--text, #eee);
    text-decoration: none;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .support-link:hover { border-color: var(--accent, #e94560); background: rgba(233,69,96,0.2); }
  .support-cta {
    text-align: center;
    padding: 20px;
    margin-top: 12px;
    border-radius: 12px;
    background: rgba(233,69,96,0.1);
    border: 1px solid rgba(233,69,96,0.35);
  }
  .support-cta p { color: var(--muted, #aaa); margin-bottom: 12px; }
</style>

const IMG_W = 1200, IMG_H = 500;

let state = {
  queue: [],
  current: null,
  score: 0,
  streak: 0,
  bestStreak: 0,
  done: new Set(),
  wrong: null,
  correct: null,
  hintMode: false,
  revealed: new Set(),
  briefReveal: null,
  _briefRevealTimer: null,
};

const els = {
  svg: document.getElementById('map-svg'),
  target: document.getElementById('target-region'),
  score: document.getElementById('score'),
  total: document.getElementById('total'),
  streak: document.getElementById('streak'),
  feedback: document.getElementById('feedback'),
  progressBar: document.getElementById('progress-bar'),
  regionList: document.getElementById('region-list'),
  quizArea: document.getElementById('quiz-area'),
  scoreArea: document.getElementById('score-area'),
  finalScore: document.getElementById('final-score'),
  finalMsg: document.getElementById('final-msg'),
  hintToggle: document.getElementById('hint-toggle'),
};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Build the SVG map once: one <path> per region (click target + fill),
// one <text> per region (label, hidden until revealed).
function buildMap() {
  els.svg.innerHTML = '';
  REGIONS.forEach(r => {
    const path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('d', r.d);
    path.setAttribute('fill', r.fill);
    path.setAttribute('class', 'region');
    path.dataset.name = r.name;
    path.addEventListener('click', () => handleRegionClick(r.name, path));
    els.svg.appendChild(path);
  });
  REGIONS.forEach(r => {
    const text = document.createElementNS(SVG_NS, 'text');
    text.setAttribute('x', r.label[0]);
    text.setAttribute('y', r.label[1]);
    text.setAttribute('font-size', r.name.length > 18 ? '11' : '13');
    text.setAttribute('class', 'region-label');
    text.dataset.name = r.name;
    // Wrap long labels across up to 3 tspans
    const words = r.name.split(' ');
    let lines = [];
    let line = '';
    words.forEach(w => {
      const test = line ? line + ' ' + w : w;
      if (test.length > 16 && line) {
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    });
    if (line) lines.push(line);
    const lineHeight = 13;
    const startDy = -((lines.length - 1) * lineHeight) / 2;
    lines.forEach((ln, i) => {
      const tspan = document.createElementNS(SVG_NS, 'tspan');
      tspan.setAttribute('x', r.label[0]);
      tspan.setAttribute('dy', i === 0 ? startDy : lineHeight);
      tspan.textContent = ln;
      text.appendChild(tspan);
    });
    els.svg.appendChild(text);
  });
}

function getPathEl(name) {
  return els.svg.querySelector(`path.region[data-name="${CSS.escape(name)}"]`);
}
function getLabelEl(name) {
  return els.svg.querySelector(`text.region-label[data-name="${CSS.escape(name)}"]`);
}

function init() {
  state.queue = shuffle(REGIONS.map(r => r.name));
  state.current = null;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.done = new Set();
  state.wrong = null;
  state.correct = null;
  state.revealed = new Set();
  state.briefReveal = null;
  els.total.textContent = REGIONS.length;
  els.score.textContent = 0;
  els.streak.textContent = 0;
  buildMap();
  buildRegionList();
  refreshAllRegionVisuals();
  nextQuestion();
}

function buildRegionList() {
  els.regionList.innerHTML = '';
  REGIONS.forEach(r => {
    const chip = document.createElement('span');
    chip.className = 'region-chip';
    chip.textContent = r.name;
    chip.dataset.name = r.name;
    els.regionList.appendChild(chip);
  });
}

function updateRegionList() {
  const chips = els.regionList.querySelectorAll('.region-chip');
  chips.forEach(c => {
    c.classList.remove('done', 'current');
    if (state.done.has(c.dataset.name)) c.classList.add('done');
    if (state.current === c.dataset.name) c.classList.add('current');
  });
}

function nextQuestion() {
  if (state.queue.length === 0) {
    showScore();
    return;
  }
  // Clear hint-target class from previous question
  REGIONS.forEach(r => {
    const p = getPathEl(r.name);
    if (p) p.classList.remove('hint-target', 'answered');
  });
  state.current = state.queue.shift();
  state.wrong = null;
  state.correct = null;
  els.target.textContent = state.current;
  setFeedback('info', 'Click on the map where you think this region is!');
  updateRegionList();
  updateProgress();
  applyHintClass();
}

function applyHintClass() {
  REGIONS.forEach(r => {
    const p = getPathEl(r.name);
    if (!p) return;
    const isTarget = state.hintMode && state.current === r.name && !state.correct;
    p.classList.toggle('hint-target', isTarget);
  });
}

function setFeedback(type, msg) {
  els.feedback.className = 'feedback ' + type;
  els.feedback.textContent = msg;
}

function updateProgress() {
  const pct = (state.done.size / REGIONS.length) * 100;
  els.progressBar.style.width = pct + '%';
}

function refreshAllRegionVisuals() {
  REGIONS.forEach(r => {
    const p = getPathEl(r.name);
    const label = getLabelEl(r.name);
    if (p) p.classList.toggle('answered', state.done.has(r.name));
    if (label) {
      const show = state.revealed.has(r.name) || state.briefReveal === r.name;
      label.classList.toggle('visible', show);
      label.classList.toggle('brief', state.briefReveal === r.name && !state.revealed.has(r.name));
    }
  });
}

function handleRegionClick(clickedName, pathEl) {
  if (!state.current) return;
  if (state.correct) return; // already answered this question

  if (clickedName === state.current) {
    state.score++;
    state.streak++;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
    state.done.add(state.current);
    state.correct = state.current;
    state.revealed.add(state.current);
    els.score.textContent = state.score;
    els.streak.textContent = state.streak;
    setFeedback('correct', `Correct! That's the ${state.current}.`);
    pathEl.classList.add('flash-correct');
    setTimeout(() => pathEl.classList.remove('flash-correct'), 600);
    updateRegionList();
    updateProgress();
    refreshAllRegionVisuals();
    applyHintClass();
    setTimeout(nextQuestion, 1200);
  } else {
    state.streak = 0;
    els.streak.textContent = 0;
    state.wrong = clickedName;
    setFeedback('wrong', `Wrong! That's the ${clickedName}. Try again.`);
    pathEl.classList.add('flash-wrong');
    setTimeout(() => pathEl.classList.remove('flash-wrong'), 600);

    // Briefly reveal the label of the mis-clicked region
    state.briefReveal = clickedName;
    refreshAllRegionVisuals();
    clearTimeout(state._briefRevealTimer);
    state._briefRevealTimer = setTimeout(() => {
      state.briefReveal = null;
      refreshAllRegionVisuals();
    }, 1200);
  }
}

function showScore() {
  els.quizArea.classList.add('hidden');
  els.scoreArea.classList.remove('hidden');
  els.finalScore.textContent = `${state.score}/${REGIONS.length}`;
  const pct = state.score / REGIONS.length;
  let msg = '';
  if (pct === 1) msg = 'Perfect score! You really know your Tennessee geography!';
  else if (pct >= 0.8) msg = 'Great job! You\'ve got a solid grasp of the state\'s regions.';
  else if (pct >= 0.5) msg = 'Not bad! A few more runs and you\'ll have it down.';
  else msg = 'Keep practicing — Tennessee has a lot of regions to learn!';
  if (state.bestStreak > 2) msg += ` Best streak: ${state.bestStreak}.`;
  els.finalMsg.textContent = msg;
}

function restart() {
  els.scoreArea.classList.add('hidden');
  els.quizArea.classList.remove('hidden');
  init();
}

// Event listeners
els.hintToggle.addEventListener('change', () => {
  state.hintMode = els.hintToggle.checked;
  document.getElementById('hint-toggle-label').classList.toggle('active', state.hintMode);
  applyHintClass();
});
document.getElementById('skip-btn').addEventListener('click', () => {
  if (state.current && !state.correct) {
    state.streak = 0;
    els.streak.textContent = 0;
    setFeedback('info', `Skipped! The answer was: ${state.current}`);
    state.done.add(state.current);
    state.correct = state.current;
    state.revealed.add(state.current);
    updateRegionList();
    updateProgress();
    refreshAllRegionVisuals();
    applyHintClass();
    setTimeout(nextQuestion, 1500);
  }
});
document.getElementById('restart-btn').addEventListener('click', restart);
document.getElementById('play-again-btn').addEventListener('click', restart);

init();
</script>
