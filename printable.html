function buildMap() {
  const svg = document.getElementById('map-svg');
  REGIONS.forEach(r => {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', r.d);
    path.setAttribute('fill', r.fill);
    path.setAttribute('class', 'region');
    svg.appendChild(path);
  });
  REGIONS.forEach(r => {
    if (r.leaderTo) {
      const [lx, ly] = r.labelPos;
      const [tx, ty] = r.leaderTo;
      const leader = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      leader.setAttribute('x1', lx);
      leader.setAttribute('y1', ly);
      leader.setAttribute('x2', tx);
      leader.setAttribute('y2', ty);
      leader.setAttribute('stroke', '#000');
      leader.setAttribute('stroke-width', '0.75');
      leader.setAttribute('stroke-dasharray', '2,1.5');
      svg.appendChild(leader);

      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', tx);
      dot.setAttribute('cy', ty);
      dot.setAttribute('r', '1.5');
      dot.setAttribute('fill', '#000');
      svg.appendChild(dot);
    }
  });

  REGIONS.forEach(r => {
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    const [lx, ly] = r.labelPos;
    const fontSize = r.fontSize || 11;
    text.setAttribute('x', lx);
    text.setAttribute('y', ly);
    text.setAttribute('font-size', fontSize);
    text.setAttribute('class', 'region-label');
    if (r.rotation) {
      text.setAttribute('transform', `rotate(${r.rotation}, ${lx}, ${ly})`);
    }
    // Wrap into multiple lines if the name is long relative to font size
    const maxCharsPerLine = fontSize >= 12 ? 16 : (fontSize >= 9 ? 22 : 30);
    const words = r.name.split(' ');
    let lines = [];
    let line = '';
    words.forEach(w => {
      const test = line ? line + ' ' + w : w;
      if (test.length > maxCharsPerLine && line) {
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    });
    if (line) lines.push(line);
    const lineHeight = fontSize + 1;
    const startDy = -((lines.length - 1) * lineHeight) / 2;
    lines.forEach((ln, i) => {
      const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      tspan.setAttribute('x', lx);
      tspan.setAttribute('dy', i === 0 ? startDy : lineHeight);
      tspan.textContent = ln;
      text.appendChild(tspan);
    });
    svg.appendChild(text);
  });
}

function buildScaleBar() {
  const svg = document.getElementById('map-svg');
  const NS = 'http://www.w3.org/2000/svg';
  // 0 mi = lower-left edge of Mississippi River Valley (x=14)
  // 100 mi = a smidge past the center of West Tennessee Uplands (x=280)
  const x0 = 14, x100 = 280;
  const y = 390; // baseline, below the map geometry (which bottoms out around y=375)

  const g = document.createElementNS(NS, 'g');
  g.setAttribute('id', 'scale-bar');

  // Main horizontal line
  const line = document.createElementNS(NS, 'line');
  line.setAttribute('x1', x0);
  line.setAttribute('y1', y);
  line.setAttribute('x2', x100);
  line.setAttribute('y2', y);
  line.setAttribute('stroke', '#000');
  line.setAttribute('stroke-width', '1.5');
  g.appendChild(line);

  // Tick marks and labels at 0, 25, 50, 75, 100 miles
  const ticks = [0, 25, 50, 75, 100];
  ticks.forEach(mi => {
    const x = x0 + (mi / 100) * (x100 - x0);
    const tick = document.createElementNS(NS, 'line');
    tick.setAttribute('x1', x);
    tick.setAttribute('y1', y - 5);
    tick.setAttribute('x2', x);
    tick.setAttribute('y2', y + 5);
    tick.setAttribute('stroke', '#000');
    tick.setAttribute('stroke-width', '1.5');
    g.appendChild(tick);

    const label = document.createElementNS(NS, 'text');
    label.setAttribute('x', x);
    label.setAttribute('y', y + 16);
    label.setAttribute('font-size', '10');
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('fill', '#000');
    label.textContent = mi;
    g.appendChild(label);
  });

  // "Miles" caption
  const caption = document.createElementNS(NS, 'text');
  caption.setAttribute('x', (x0 + x100) / 2);
  caption.setAttribute('y', y + 30);
  caption.setAttribute('font-size', '10');
  caption.setAttribute('font-weight', '700');
  caption.setAttribute('text-anchor', 'middle');
  caption.setAttribute('fill', '#000');
  caption.textContent = 'Miles';
  g.appendChild(caption);

  svg.appendChild(g);
}

function buildLegend() {
  const list = document.getElementById('legend-list');
  REGIONS.forEach(r => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    const swatch = document.createElement('div');
    swatch.className = 'legend-swatch';
    swatch.style.backgroundColor = r.fill;
    const name = document.createElement('div');
    name.textContent = r.name;
    item.appendChild(swatch);
    item.appendChild(name);
    list.appendChild(item);
  });
}

buildMap();
buildScaleBar();
buildLegend();
</script>
